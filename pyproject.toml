[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dikwp-mesh2"
version = "1.0.0"
description = "Multi-observer DIKWP semantic hypergraph and higher-order transformation system"
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "scipy>=1.11", "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "jinja2>=3.1"]

[project.scripts]
dikwp-mesh2 = "dikwp_mesh2.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
